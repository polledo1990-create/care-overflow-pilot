name: Validate pilot

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main", "agent/**"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: node --check assets/app.js

      - name: Verify required files
        run: |
          test -f index.html
          test -f assets/app.js
          test -f assets/styles.css
          test -f datenschutz.html
          test -f impressum.html
          test -f README.md

      - name: Verify local-only disclosure
        run: |
          grep -q "keine Daten an einen Server" index.html
          grep -q "kein Backend" README.md
